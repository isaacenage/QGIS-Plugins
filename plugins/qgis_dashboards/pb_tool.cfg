# Sane defaults for your plugin generated by the Plugin Builder are
# already set below.
# 
# As you add Python source files and UI files to your plugin, add
# them to the appropriate [files] section below.

[plugin]
# Name of the plugin. This is the name of the directory that will
# be created in .qgis2/python/plugins
name: qgis_dashboards

# Full path to where you want your plugin directory copied. If empty,
# the QGIS default path will be used. Don't include the plugin name in
# the path.
plugin_path:

[files]
# Python  files that should be deployed with the plugin
python_files: __init__.py main_plugin.py window.py bus.py theme.py presets.py icons.py user_fonts.py sidebar.py minimized_bubble.py dashboard_canvas.py page_view.py zoom_fit.py tile_snap.py add_element_dialog.py element_picker.py settings_dialog.py appearance_dialog.py tile_style_form.py connections_dialog.py side_panel.py form_util.py export_dialog.py publish_dialog.py submit_payload.py submit_client.py publisher.py project_io.py recent_store.py start_view.py layout_util.py history.py scripting.py auto_layout.py indicator_expr.py field_select.py connection_actions.py

# The main dialog file that is loaded (not compiled). The dashboard is hosted
# in a standalone window built in code, so there is no .ui main dialog.
main_dialog:

# Other ui files for dialogs you create (these will be compiled)
compiled_ui_files:

# Resource file(s) that will be compiled
resource_files: resources.qrc

# Other files required for the plugin
extras: metadata.txt icon.png LICENSE

# Other directories to be deployed with the plugin.
# These must be subdirectories under the plugin directory
extra_dirs: elements export

# ISO code(s) for any locales (translations), separated by spaces.
# Corresponding .ts files must exist in the i18n directory
locales:


