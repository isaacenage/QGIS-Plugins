# Configuration file for plugin builder tool (pb_tool)
# Consult the pb_tool docs for more information on how to use this file
#
# Issue the command (from the directory containing this file):
#   pb_tool deploy
# to deploy the plugin to your QGIS plugin directory.
#
# Every new Python module and every new asset directory must be registered
# here AND in the Makefile, or it will not ship in the packaged zip.

[plugin]
name: autoqad
version: 0.1

[files]
# Python files that will be deployed.
python_files: __init__.py main_plugin.py controller.py scripting.py

# Other files required by the plugin.
extras: metadata.txt icon.png LICENSE README.md install.py

# Directories deployed whole, preserving structure.
extra_dirs: core engine input geom style commands ui io

# UI files, if any (AutoQAD builds its interface in code).
form_files:

# Resource files to compile.
resource_files:

# Help files.
help_source:

[localization]
# Locales to build .qm files for.
locales:

[optional]
# Files to exclude from deployment.
exclude: test __pycache__
